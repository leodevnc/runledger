[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "runledger"
version = "0.1.0"
description = "Inspectable execution, approval, recovery, and replay for explicit agent tool plans"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
runledger = "runledger.__main__:main"

[tool.setuptools.packages.find]
include = ["runledger*"]

[tool.setuptools.package-data]
runledger = ["static/*"]
